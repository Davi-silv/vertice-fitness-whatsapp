<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão · Vértice Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="icon" href="/assets/logo-icon.png" type="image/png" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__top">
        <a class="brand" href="/">
          <img src="/assets/logo-icon.png" alt="" width="28" height="28" />
          <span>Vértice</span>
        </a>
        <button type="button" class="sidebar__close" id="sidebar-close" aria-label="Fechar menu">×</button>
      </div>

      <p class="nav-label">Operação</p>
      <nav class="nav" id="nav">
        <button type="button" data-page="dashboard" class="is-active">
          <span class="nav__icon" aria-hidden="true">◈</span>
          <span>Visão geral</span>
        </button>
        <button type="button" data-page="checkin">
          <span class="nav__icon" aria-hidden="true">◎</span>
          <span>Check-in</span>
        </button>
        <button type="button" data-page="schedule">
          <span class="nav__icon" aria-hidden="true">☰</span>
          <span>Agenda</span>
        </button>
        <button type="button" data-page="members">
          <span class="nav__icon" aria-hidden="true">◉</span>
          <span>Alunos</span>
        </button>

        <p class="nav-label">Gestão</p>
        <button type="button" data-page="finance">
          <span class="nav__icon" aria-hidden="true">$</span>
          <span>Financeiro</span>
        </button>
        <button type="button" data-page="plans">
          <span class="nav__icon" aria-hidden="true">◆</span>
          <span>Planos</span>
        </button>
        <button type="button" data-page="teachers">
          <span class="nav__icon" aria-hidden="true">✦</span>
          <span>Professores</span>
        </button>
      </nav>

      <div class="sidebar__foot">
        <div class="user-chip">
          <span class="user-chip__dot" aria-hidden="true"></span>
          <p id="user-label">—</p>
        </div>
        <button type="button" id="logout" class="soft">Sair</button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <main class="content">
      <header class="top">
        <div class="top__left">
          <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
          <div>
            <h1 id="page-title">Visão geral</h1>
            <p class="top__sub" id="page-sub">Resumo do dia e prioridades da academia</p>
          </div>
        </div>
        <div class="top__actions">
          <a href="/" class="ghost">Ver site</a>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <script src="/admin/admin.js"></script>
</body>
</html>
